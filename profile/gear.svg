<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Gold gear emblem on a navy engineering drawing sheet</title>
  <desc>An eight-tooth gold gear centered on a navy blueprint-style sheet with centerlines, construction circles, a 45 degree tooth pitch mark, a diameter dimension and a small title block.</desc>

  <defs>
    <radialGradient id="bg" cx=".5" cy=".5" r=".75">
      <stop offset="0" stop-color="#0f2742"/>
      <stop offset="1" stop-color="#06111f"/>
    </radialGradient>

    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="-92" y1="-92" x2="92" y2="92">
      <stop offset="0" stop-color="#f0d98c"/>
      <stop offset=".5" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#8a6d10"/>
    </linearGradient>

    <radialGradient id="halo">
      <stop offset="0" stop-color="#d4af37" stop-opacity=".2"/>
      <stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#7fa8d6" stroke-opacity=".05"/>
    </pattern>
    <pattern id="gridMajor" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0H0V100" fill="none" stroke="#7fa8d6" stroke-opacity=".09"/>
    </pattern>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".5"/>
    </filter>

    <marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1L10 5L0 9Z" fill="#d4af37"/>
    </marker>
  </defs>

  <rect width="1000" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="300" rx="18" fill="url(#grid)"/>
  <rect width="1000" height="300" rx="18" fill="url(#gridMajor)"/>
  <rect x="10" y="10" width="980" height="280" rx="10" fill="none" stroke="#d4af37" stroke-opacity=".3"/>

  <g font-family="'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif">

    <g fill="none" stroke="#d4af37" stroke-linecap="butt">
      <path d="M26 150H974M500 26V274" stroke-opacity=".4" stroke-dasharray="16 4 2 4"/>
    </g>

    <g transform="translate(500 150)">
      <circle r="120" fill="url(#halo)"/>

      <g fill="none" stroke="#d4af37">
        <circle r="108" stroke-opacity=".38" stroke-dasharray="4 4"/>
        <circle r="126" stroke-opacity=".14"/>
        <path d="M0 0L89.1 -89.1" stroke-opacity=".4" stroke-dasharray="16 4 2 4"/>
        <path d="M0 -118A118 118 0 0 1 83.4 -83.4" stroke-opacity=".8" marker-start="url(#arr)" marker-end="url(#arr)"/>
        <path d="M-65.05 -65.05L-112 -112H-200" stroke-opacity=".7"/>
        <path d="M0 -92H150M0 92H150" stroke-opacity=".3" stroke-dasharray="2 4"/>
        <path d="M140 -92V92" stroke-opacity=".8" marker-start="url(#arr)" marker-end="url(#arr)"/>
      </g>
      <circle cx="-65.05" cy="-65.05" r="2.5" fill="#d4af37"/>

      <g filter="url(#shadow)">
        <path d="M-16.43 -63.92 L-9.86 -91.47 A92 92 0 0 1 9.86 -91.47 L16.43 -63.92 A66 66 0 0 1 33.58 -56.82 L57.71 -71.65 A92 92 0 0 1 71.65 -57.71 L56.82 -33.58 A66 66 0 0 1 63.92 -16.43 L91.47 -9.86 A92 92 0 0 1 91.47 9.86 L63.92 16.43 A66 66 0 0 1 56.82 33.58 L71.65 57.71 A92 92 0 0 1 57.71 71.65 L33.58 56.82 A66 66 0 0 1 16.43 63.92 L9.86 91.47 A92 92 0 0 1 -9.86 91.47 L-16.43 63.92 A66 66 0 0 1 -33.58 56.82 L-57.71 71.65 A92 92 0 0 1 -71.65 57.71 L-56.82 33.58 A66 66 0 0 1 -63.92 16.43 L-91.47 9.86 A92 92 0 0 1 -91.47 -9.86 L-63.92 -16.43 A66 66 0 0 1 -56.82 -33.58 L-71.65 -57.71 A92 92 0 0 1 -57.71 -71.65 L-33.58 -56.82 A66 66 0 0 1 -16.43 -63.92 Z M-36 0A36 36 0 1 0 36 0A36 36 0 1 0 -36 0Z" fill="url(#gold)" fill-rule="evenodd" stroke="#f6e7a8" stroke-opacity=".5" stroke-width=".8"/>
        <circle r="52" fill="none" stroke="#8a6d10" stroke-opacity=".6" stroke-width="1.2"/>
        <path d="M-23 0A23 23 0 1 0 23 0A23 23 0 1 0 -23 0Z M-10 0A10 10 0 1 0 10 0A10 10 0 1 0 -10 0Z" fill="url(#gold)" fill-rule="evenodd"/>
      </g>

      <g fill="#e8cf7a" font-size="13">
        <text x="54" y="-122" font-size="12">45°</text>
        <text x="150" y="-8">Ø 112</text>
        <text x="-200" y="-118" font-size="12">8 teeth</text>
      </g>
    </g>

    <g fill="none" stroke="#d4af37" stroke-opacity=".45">
      <rect x="764" y="236" width="188" height="40"/>
      <path d="M858 236V276"/>
    </g>
    <g fill="#8fa6c0" font-size="9">
      <text x="772" y="248">scale</text>
      <text x="866" y="248">sheet</text>
    </g>
    <g fill="#e8cf7a" font-size="13">
      <text x="772" y="267">1:1</text>
      <text x="866" y="267">1 / 1</text>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
